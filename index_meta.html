  <button id="music-toggle-btn" style="position:fixed;bottom:20px;right:20px;z-index:999999;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;background:#ffffff;color:#111827;border-radius:9999px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;border:1.5px solid #111827;box-shadow:3px 3px 0px #111827;cursor:pointer;transition:all 0.15s ease;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'" title="On/Off Musik Instrumen">

<script id="dhodhy-splash-music">
// --- DHODHY RAHMADDI: PURE AUTOPLAY & MINIMAL SPLASH ENGINE ---
(function() {
  const splash = document.getElementById('splash-screen');
  const bgm = document.getElementById('bgm');
  const musicToggle = document.getElementById('music-toggle-btn');
  const musicIcon = document.getElementById('music-icon');
  const musicText = document.getElementById('music-status-text');

  let isPlaying = false;

  // Set comfortable background volume
  if (bgm) {
    bgm.volume = 0.55;
  }

  function updateMusicUI(active) {
    if (!musicToggle) return;
    isPlaying = active;
    if (active) {
      musicIcon.textContent = '🎵';
      musicText.textContent = 'Musik: ON';
      musicToggle.style.background = '#111827';
      musicToggle.style.color = '#ffffff';
      musicToggle.style.boxShadow = '3px 3px 0px #4F46E5';
    } else {
      musicIcon.textContent = '🔇';
      musicText.textContent = 'Musik: OFF';
      musicToggle.style.background = '#ffffff';
      musicToggle.style.color = '#111827';
      musicToggle.style.boxShadow = '3px 3px 0px #111827';
    }
  }

  function playBGM() {
    if (!bgm) return;
    const p = bgm.play();
    if (p !== undefined) {
      p.then(() => {
        updateMusicUI(true);
      }).catch((e) => {
        // Browser requires a click on the page before playing audio
        console.log('Autoplay waiting for user gesture:', e.message);
      });
    }
  }

  // 1. Trigger pure autoplay immediately
  playBGM();
  window.addEventListener('load', playBGM);

  // 2. Fallback: if browser blocked 0-interaction audio, play on the very first touch/click anywhere
  const triggerAudioOnGesture = () => {
    if (!isPlaying) {
      playBGM();
    }
  };
  ['click', 'touchstart', 'mousedown', 'keydown'].forEach(evt => {
    window.addEventListener(evt, triggerAudioOnGesture, { passive: true });
  });

  // 3. Splash Screen: stays for exactly 5 seconds, then fades away automatically
  setTimeout(() => {
    if (splash) {
      splash.style.opacity = '0';
      splash.style.pointerEvents = 'none';
      setTimeout(() => {
        splash.style.display = 'none';
      }, 850);
    }
  }, 5000);

  // 4. Music Toggle button
  if (musicToggle) {
    musicToggle.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!bgm) return;
      if (bgm.paused) {
        bgm.play().then(() => updateMusicUI(true)).catch(() => {});
      } else {
        bgm.pause();
        updateMusicUI(false);
      }
    });
  }
})();
</script>
